name: Builder

# Builds the add-on's image for each architecture with Home Assistant's reusable builder
# actions, and publishes it to ghcr.io/<owner>/<arch>-jj-musubi-hub:<version>, which is
# what config.yaml's `image` points Supervisor at. Pull requests build without publishing.
# An image is published once per add-on version: bump `version` in config.yaml to publish.

on:
  push:
    branches:
      - main
    paths:
      - "jj-musubi-hub/**"
      - ".github/workflows/builder.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "jj-musubi-hub/**"
      - ".github/workflows/builder.yaml"
  workflow_dispatch:

env:
  ADDON: jj-musubi-hub

permissions:
  contents: read

jobs:
  init:
    name: Initialize build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.info.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Read add-on version and architectures
        id: info
        run: |
          version=$(yq -r '.version' "${ADDON}/config.yaml")
          architectures=$(yq -o=json -I=0 '.arch' "${ADDON}/config.yaml")
          echo "Add-on ${ADDON} ${version} for ${architectures}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "architectures=${architectures}" >> "$GITHUB_OUTPUT"

      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ env.ADDON }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # To check out the code
      id-token: write # For Cosign signing
      packages: write # To push images to GitHub Container Registry
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      # build.yaml is what Supervisor would use to build the add-on locally; the build here
      # takes its base image, args and labels from it, so the two can't drift apart.
      - name: Read build.yaml
        id: build_config
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          build="${ADDON}/build.yaml"
          {
            echo "args<<EOF"
            echo "BUILD_FROM=$(yq -r ".build_from.${ARCH}" "${build}")"
            yq -r '(.args // {}) | to_entries | .[] | .key + "=" + (.value | tostring)' "${build}"
            echo "EOF"
            echo "labels<<EOF"
            yq -r '(.labels // {}) | to_entries | .[] | .key + "=" + (.value | tostring)' "${build}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: ${{ env.ADDON }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          version: ${{ needs.init.outputs.version }}
          build-args: ${{ steps.build_config.outputs.args }}
          labels: ${{ steps.build_config.outputs.labels }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          push: ${{ github.event_name != 'pull_request' }}
          skip-existing: ${{ needs.init.outputs.version }}
